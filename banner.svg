<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="NUSA ECO - Bank Sampah Sekolah Adiwiyata" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3A24"/>
      <stop offset="0.55" stop-color="#1A5236"/>
      <stop offset="1" stop-color="#236B45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#DCEBDD" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#DCEBDD" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#DCEBDD" fill-opacity="0.12"/>
    </pattern>
    <symbol id="leaf" viewBox="0 0 40 40">
      <path d="M20 3c11 3 17 12 15 22-1 7-7 12-15 12S5 32 5 24C5 13 11 6 20 3z"/>
    </symbol>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <!-- dekorasi daun -->
  <g fill="#DCEBDD">
    <use href="#leaf" x="930" y="-40" width="300" height="300" fill-opacity="0.07" transform="rotate(18 1080 110)"/>
    <use href="#leaf" x="1030" y="170" width="190" height="190" fill-opacity="0.08" transform="rotate(-25 1125 265)"/>
    <use href="#leaf" x="620" y="250" width="110" height="110" fill-opacity="0.06" transform="rotate(40 675 305)"/>
  </g>

  <!-- logo -->
  <circle cx="190" cy="175" r="105" fill="#DCEBDD" fill-opacity="0.12"/>
  <circle cx="190" cy="175" r="84" fill="#DCEBDD"/>
  <g transform="translate(120 105) scale(3.5)">
    <path d="M20 3c11 3 17 12 15 22-1 7-7 12-15 12S5 32 5 24C5 13 11 6 20 3z" fill="#236B45"/>
    <path d="M20 12v22M20 22l-7-6M20 27l8-7" stroke="#DCEBDD" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- teks -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="335" y="140" font-size="22" font-weight="600" letter-spacing="6" fill="#DCEBDD" fill-opacity="0.85">SMKN 4 KUNINGAN</text>
    <text x="330" y="225" font-size="96" font-weight="800" letter-spacing="3" fill="#FFFFFF">NUSA ECO</text>
    <text x="335" y="272" font-size="28" fill="#DCEBDD">Bank Sampah Sekolah Adiwiyata</text>
    <rect x="335" y="292" width="90" height="5" rx="2.5" fill="#7FCB9A"/>
    <text x="335" y="332" font-size="19" fill="#DCEBDD" fill-opacity="0.8">Pilah &#8226; Setor &#8226; Scan &#8226; Dampak &#8212; Reduce, Reuse, Recycle</text>
  </g>

  <!-- gelombang bawah -->
  <path d="M0 352 C200 328 400 372 600 352 S1000 328 1200 352 V380 H0 Z" fill="#DCEBDD" fill-opacity="0.14"/>
  <path d="M0 366 C220 346 420 384 640 366 S1000 348 1200 366 V380 H0 Z" fill="#DCEBDD" fill-opacity="0.22"/>
